<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Настройка панелей</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Первый запуск</p>
      <h1>Укажите адреса панелей</h1>
      <p class="description">Каждый сайт откроется в своей трети основного окна.</p>

      <form id="settings-form" novalidate>
        <div id="panel-fields"></div>
        <p id="form-error" role="alert"></p>
        <button type="submit">Сохранить и открыть</button>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
