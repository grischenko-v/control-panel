name: Линтинг и тесты

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Линтинг и тесты
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v7
      - name: Установить Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Установить зависимости
        run: bun ci
      - name: Запустить тесты
        run: bun run test
      - name: Запустить ESLint
        run: bun run lint
