name: Обновление latest

on:
  workflow_run:
    workflows: ["Линтинг и тесты"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: latest-main
  cancel-in-progress: true

jobs:
  build:
    name: Сборка latest — ${{ matrix.title }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - title: Windows x64
            os: windows-latest
            command: build:win
            artifact: windows-x64
            extension: .exe
            release_file: ControlPanel_latest_x64.exe
          - title: macOS ARM64
            os: macos-14
            command: build:mac
            artifact: macos-arm64
            extension: .dmg
            release_file: ControlPanel_latest_arm64.dmg
          - title: Linux x64
            os: ubuntu-latest
            command: build:linux
            artifact: linux-x64
            extension: .AppImage
            release_file: ControlPanel_latest_x64.AppImage
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Получить проверенный коммит
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Установить Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: Установить зависимости
        run: bun ci
      - name: Собрать приложение
        run: bun run ${{ matrix.command }}
      - name: Подготовить имя установщика
        run: bun scripts/rename-release-asset.mjs ${{ matrix.extension }} ${{ matrix.release_file }}
      - name: Передать установщик в задачу публикации
        uses: actions/upload-artifact@v7
        with:
          name: latest-${{ matrix.artifact }}
          path: dist/${{ matrix.release_file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Обновление плавающего релиза
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Получить проверенный коммит
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Скачать собранные установщики
        uses: actions/download-artifact@v8
        with:
          pattern: latest-*
          path: release-assets
          merge-multiple: true
      - name: Перенести тег latest
        shell: bash
        env:
          LATEST_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force latest "$LATEST_SHA"
          git push origin refs/tags/latest --force
      - name: Создать или обновить релиз latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${LATEST_SHA:0:7}"
          NOTES="Автоматическая сборка последнего проверенного коммита ветки main: [${SHORT_SHA}](https://github.com/${GITHUB_REPOSITORY}/commit/${LATEST_SHA})."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release-assets/* --clobber
            while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
              case "$ASSET_NAME" in
                ControlPanel_latest_x64.exe|ControlPanel_latest_arm64.dmg|ControlPanel_latest_x64.AppImage) ;;
                *) gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.assets[] | [.id, .name] | @tsv')
            gh release edit latest \
              --title "Последняя сборка main" \
              --notes "$NOTES" \
              --latest
          else
            gh release create latest release-assets/* \
              --verify-tag \
              --title "Последняя сборка main" \
              --notes "$NOTES" \
              --latest
          fi

  cleanup:
    name: Удаление временных артефактов
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Удалить временные сборки
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              },
            );
            for (const artifact of artifacts.filter(({ name }) => name.startsWith('latest-'))) {
              core.info(`Удаление артефакта: ${artifact.name} (${artifact.id})`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
